version: "v0.4"
project:
  name: "The Fibonacci remainder and Lucas norm of the product resultant for xⁿ − x − 1"
  description: >-
    Let Rₙ(t) be the resultant in x of x² − x − 1 and tⁿ − txⁿ⁻¹ − xⁿ.
    For every n ≥ 3, we compute Rₙ(t) explicitly in ℤ[t], prove that its remainder
    modulo t² − t − 1 is (−F₂ₙ + (−1)ⁿ⁺¹)t − F₂ₙ₋₁, and identify the algebra norm
    of its residue in ℤ[φ] as (−1)ⁿ⁺¹L₂ₙ₋₁. The absolute norm is at least 11, with
    equality exactly when n = 3. This formalizes Stephanie Alexander’s Theorem 2
    for the product resultant and derives the sharp minimum.
  authors: ["Stephanie Alexander"]
  responsible_maintainers: ["Stephanie Alexander"]
  license: "MIT"
classification:
  arxiv: ["math.NT"]
  msc2020: ["11B39", "11C08"]
sources:
