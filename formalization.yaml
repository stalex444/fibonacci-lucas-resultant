status:
  scope: "The m = 2 product-resultant row, for every n ≥ 3. The minimum is taken along this entire row."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
fidelity:
  divergences: >-
    The source also describes the resultant as the minimal polynomial of a product.
    These statements use the resultant from equation (2). Equality with the minimal
    polynomial requires irreducibility. The lower bound and its equality case are
    consequences of Theorem 2.
