    authors: ["Stephanie Alexander"]
    type: "paper"
    id: "https://doi.org/10.5281/zenodo.18817597"
    location: "Equation (2), Theorem 2 and its proof, Definition 1 and Table 1"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: "The primary mathematical source, a preprint by the maintainer. The sharp absolute minimum is deduced from the signed norm identity."
  - title: "Degree n Relatives of the Golden Ratio and Resultants of the Corresponding Polynomials"
    authors: ["David E. Rush"]
    type: "paper"
    id: "https://www.mathstat.dal.ca/FQ/Papers1/50-4/Rush.pdf"
    location: "Fibonacci Quarterly 50 (2012), Proposition 3.4"
    relationship: "background"
    note: "Rush obtains the same absolute Lucas values for odd shifts in ordinary Selmer resultants. The present theorem retains the linear remainder of the multiplicative product resultant."
  - title: "Irreducibles and the composed product for polynomials over a finite field"
    authors: ["J. V. Brawley", "L. Carlitz"]
    type: "paper"
    id: "https://doi.org/10.1016/0012-365X(87)90135-X"
    relationship: "background"
    note: "The multiplicative composed product forms a polynomial from pairwise products of roots. Their setting is finite fields."
